<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listing — StagNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header id="nav"></header>

<main>
  <div id="listingRoot" class="listing-detail container"></div>
</main>

<footer id="footer"></footer>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
  // Icons not already defined on the shared ICONS object in app.js.
  var ICON = {
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h6l6 6v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z"/><path d="M14 2v6h6"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>',
    car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16V9l2-4h14l2 4v7"/><path d="M3 16h18M6.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm11 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/></svg>',
    msg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.5 8.7 8.7 0 0 1-3.8-.9L3 20l1-5.2A8.4 8.4 0 0 1 12.5 3a8.4 8.4 0 0 1 8.5 8.5Z"/></svg>',
    heart: function (filled) { return '<svg viewBox="0 0 24 24" fill="' + (filled ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 8.6c0 5.6-8.8 10.9-8.8 10.9S3.2 14.2 3.2 8.6a5 5 0 0 1 9-3 5 5 0 0 1 8.6 3Z"/></svg>'; }
  };

  var params = new URLSearchParams(location.search);
  var id = Number(params.get("id")) || window.LISTINGS[0].id;
  var listing = window.LISTINGS.find(function (l) { return l.id === id; }) || window.LISTINGS[0];

  function walkBar(label, minutes) {
    var pct = Math.max(6, 100 - (minutes / 30) * 100);
    return '<div class="bar-row"><div class="bar-label">' + label + '</div><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div><div class="bar-val">' + minutes + ' min</div></div>';
  }
  function scoreBar(label, val) {
    var pct = val * 10;
    return '<div class="bar-row"><div class="bar-label">' + label + '</div><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div><div class="bar-val">' + val + '/10</div></div>';
  }

  /* ---------------- Gallery ---------------- */
  var galleryPhotos = listing.photos;
  var photosHtml = galleryPhotos.map(function (src, i) {
    var loading = i === 0 ? "eager" : "lazy";
    return '<div class="ph" data-idx="' + i + '" style="background:linear-gradient(135deg,' + listing.color + 'cc,' + listing.color + '77)">' +
      ICONS.home +
      '<img src="' + src + '" alt="' + listing.title + ' photo ' + (i + 1) + '" loading="' + loading + '" onerror="this.remove()">' +
    "</div>";
  }).join("");

  /* ---------------- Amenities ---------------- */
  var amenitiesHtml = listing.amenities.map(function (a) {
    return '<div class="amenity-item"><div class="amenity-ic">' + amenityIcon(a) + '</div>' + a + "</div>";
  }).join("");

  /* ---------------- Reviews ---------------- */
  function starRow(rating) {
    var out = "";
    for (var i = 1; i <= 5; i++) {
      out += ICONS.star.replace("<svg ", '<svg class="' + (i <= rating ? "on" : "") + '" ');
    }
    return out;
  }
  var reviewsHeadHtml = listing.reviewCount > 0
    ? ICONS.star + listing.rating.toFixed(1) + " · " + listing.reviewCount + " review" + (listing.reviewCount === 1 ? "" : "s")
    : "Reviews";
  var reviewsBodyHtml = listing.reviewCount > 0
    ? '<div class="reviews-grid">' + listing.reviews.map(function (r) {
        return '<div class="review-card">' +
          '<div class="review-head">' +
            '<div class="landlord-avatar sm">' + r.initials + '</div>' +
            '<div><div class="review-name">' + r.name + '</div><div class="review-date">' + r.date + '</div></div>' +
          "</div>" +
          '<div class="review-stars">' + starRow(r.rating) + "</div>" +
          '<p class="review-text">' + r.text + "</p>" +
        "</div>";
      }).join("") + "</div>"
    : '<div class="reviews-empty">No reviews yet — be the first tenant to review this house after you move in.</div>';

  var initials = listing.landlord.split(" ").map(function (w) { return w[0]; }).join("").slice(0, 2);

  var html =
    '<div class="gallery-wrap">' +
      '<div class="photo-grid" id="photoGrid">' + photosHtml + "</div>" +
      '<button type="button" class="show-all-photos-btn" id="showAllBtn">' + ICONS.grid + " Show all photos</button>" +
    "</div>" +
    '<div class="detail-layout">' +
      '<div class="detail-main">' +
        '<h1>' + listing.title + "</h1>" +
        '<div class="detail-addr">' + ICON.pin + listing.address + "</div>" +
        '<div class="detail-badges">' +
          ratingLine(listing) +
          (listing.verified ? '<span class="badge badge-green">' + ICONS.check + " Verified landlord</span>" : "") +
          '<span class="badge badge-gray">' + listing.lease + " lease</span>" +
        "</div>" +

        '<div class="facts-row">' +
          '<div class="fact"><div class="v">' + listing.beds + '</div><div class="k">Bedrooms</div></div>' +
          '<div class="fact"><div class="v">' + listing.baths + '</div><div class="k">Bathrooms</div></div>' +
          '<div class="fact"><div class="v">' + listing.avail + '</div><div class="k">Available</div></div>' +
          '<div class="fact"><div class="v">' + listing.lease + '</div><div class="k">Lease term</div></div>' +
        "</div>" +

        '<div class="detail-section">' +
          '<h2>About this house</h2>' +
          '<p>' + listing.desc + '</p>' +
        "</div>" +

        '<div class="detail-section">' +
          '<h2>Location ratings</h2>' +
          '<div class="card card-pad">' +
            walkBar("Walk to campus", listing.r.campus) +
            walkBar('Walk to <a href="https://www.seagrapect.com/" target="_blank" rel="noopener">The Seagrape</a>', listing.r.bars) +
            walkBar("Walk to restaurants", listing.r.rest) +
            walkBar("Walk to grocery", listing.r.grocery) +
          "</div>" +
          '<div class="drive-note">' + ICON.car + listing.r.driveCampus + " min if you'd rather drive to campus</div>" +
          '<div class="card card-pad" style="margin-top:14px">' +
            scoreBar("Safety", listing.r.safety) +
            scoreBar("Quiet", listing.r.quiet) +
            scoreBar("Convenience", listing.r.conv) +
          "</div>" +
        "</div>" +

        '<div class="detail-section">' +
          '<h2>Amenities</h2>' +
          '<div class="amenity-grid">' + amenitiesHtml + "</div>" +
        "</div>" +

        '<div class="detail-section">' +
          '<h2>Parking</h2>' +
          '<p>' + listing.parking + '</p>' +
        "</div>" +

        '<div class="detail-section">' +
          '<h2 class="reviews-head">' + reviewsHeadHtml + "</h2>" +
          reviewsBodyHtml +
        "</div>" +
      "</div>" +

      '<div>' +
        '<div class="card card-pad sidebar-card">' +
          '<div class="sidebar-rating-row">' + ratingLine(listing) + "</div>" +
          '<div class="sidebar-price">' + window.money(listing.rent) + '<span> / mo</span></div>' +
          '<hr class="sidebar-divider">' +
          '<div class="key-facts-mini">' +
            "<div>" + ICONS.bed + listing.beds + " bed</div>" +
            "<div>" + ICONS.bath + listing.baths + " bath</div>" +
            "<div>" + ICON.cal + "Avail " + listing.avail + "</div>" +
            "<div>" + ICON.doc + listing.lease + "</div>" +
          "</div>" +
          '<div class="sidebar-actions">' +
            '<a href="signin.html" class="btn btn-primary btn-lg btn-block" id="applyBtn">Apply now</a>' +
            '<div class="reassurance">You won\'t be charged yet — applications are reviewed before any deposit is due.</div>' +
            '<button class="btn btn-outline btn-block" id="saveBtn"></button>' +
            '<button class="btn btn-ghost btn-block" id="msgBtn">' + ICON.msg + " Message landlord</button>" +
          "</div>" +
          '<hr class="sidebar-divider">' +
          '<div class="landlord-row" style="margin-bottom:14px; padding-bottom:14px">' +
            '<div class="landlord-avatar">' + initials + '</div>' +
            '<div>' +
              '<div class="landlord-name">' + listing.landlord + '</div>' +
              '<div class="landlord-resp">' + listing.resp + '</div>' +
            "</div>" +
          "</div>" +
          '<div class="price-line"><span>Security deposit</span><span>' + window.money(listing.deposit) + '</span></div>' +
          '<div class="price-line total"><span>Due at signing</span><span>' + window.money(listing.rent + listing.deposit) + '</span></div>' +
          '<div id="msgPanel" class="hidden" style="margin-top:14px">' +
            '<textarea class="input" id="msgText" placeholder="Hi ' + listing.landlord.split(" ")[0] + ', is this still available?" rows="3"></textarea>' +
            '<button class="btn btn-dark btn-block" id="msgSendBtn" style="margin-top:10px">Send message</button>' +
            '<div id="msgSent" class="hidden" style="margin-top:10px;font-size:13px;color:var(--emerald);font-weight:700">Message sent — you will hear back via email.</div>' +
          "</div>" +
        "</div>" +
      "</div>" +
    "</div>" +

    '<div class="lightbox" id="lightbox">' +
      '<button type="button" class="lightbox-close" id="lightboxClose">' + ICONS.close + "</button>" +
      '<button type="button" class="lightbox-nav prev" id="lightboxPrev">' + ICONS.chevronLeft + "</button>" +
      '<img class="lightbox-img" id="lightboxImg" src="" alt="">' +
      '<button type="button" class="lightbox-nav next" id="lightboxNext">' + ICONS.chevronRight + "</button>" +
      '<div class="lightbox-counter" id="lightboxCounter"></div>' +
    "</div>";

  document.getElementById("listingRoot").innerHTML = html;
  document.title = listing.title + " — StagNest";

  /* ---------------- Save / message ---------------- */
  function refreshSaveBtn() {
    var fav = isFav(listing.id);
    var btn = document.getElementById("saveBtn");
    btn.innerHTML = ICON.heart(fav) + (fav ? " Saved" : " Save listing");
    btn.classList.toggle("btn-outline", !fav);
  }
  refreshSaveBtn();
  document.getElementById("saveBtn").addEventListener("click", function () {
    toggleFav(listing.id);
    refreshSaveBtn();
  });

  document.getElementById("msgBtn").addEventListener("click", function () {
    document.getElementById("msgPanel").classList.toggle("hidden");
  });
  document.getElementById("msgSendBtn").addEventListener("click", function () {
    var text = document.getElementById("msgText");
    if (!text.value.trim()) { text.focus(); return; }
    document.getElementById("msgSent").classList.remove("hidden");
    document.getElementById("msgSendBtn").disabled = true;
  });

  /* ---------------- Lightbox ---------------- */
  var lightboxIndex = 0;
  var lightboxEl = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightboxImg");
  var lightboxCounter = document.getElementById("lightboxCounter");

  function updateLightbox() {
    lightboxImg.src = galleryPhotos[lightboxIndex];
    lightboxImg.alt = listing.title + " photo " + (lightboxIndex + 1);
    lightboxCounter.textContent = (lightboxIndex + 1) + " / " + galleryPhotos.length;
  }
  function openLightbox(idx) {
    lightboxIndex = idx;
    updateLightbox();
    lightboxEl.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeLightbox() {
    lightboxEl.classList.remove("open");
    document.body.style.overflow = "";
  }
  function nextPhoto() { lightboxIndex = (lightboxIndex + 1) % galleryPhotos.length; updateLightbox(); }
  function prevPhoto() { lightboxIndex = (lightboxIndex - 1 + galleryPhotos.length) % galleryPhotos.length; updateLightbox(); }

  document.getElementById("photoGrid").addEventListener("click", function (e) {
    var tile = e.target.closest(".ph");
    if (!tile) return;
    openLightbox(Number(tile.dataset.idx));
  });
  document.getElementById("showAllBtn").addEventListener("click", function () { openLightbox(0); });
  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  document.getElementById("lightboxNext").addEventListener("click", nextPhoto);
  document.getElementById("lightboxPrev").addEventListener("click", prevPhoto);
  lightboxEl.addEventListener("click", function (e) {
    if (e.target === lightboxEl) closeLightbox();
  });
  document.addEventListener("keydown", function (e) {
    if (!lightboxEl.classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowRight") nextPhoto();
    if (e.key === "ArrowLeft") prevPhoto();
  });
</script>
</body>
</html>
